databases:
  - name: cab-ride-fault-db
    plan: free
    databaseName: cabride
    user: cabride

services:
  - type: web
    name: cab-ride-fault-logger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cab-ride-fault-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.11.1
