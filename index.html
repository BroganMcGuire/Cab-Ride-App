<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14181a">
<title>Cab Ride Fault Log</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="statusbar">
  <span id="status-net" class="pill">…</span>
  <span id="status-gps" class="pill">GPS —</span>
  <span id="status-ride" class="pill" hidden>● RECORDING</span>
</div>

<!-- HOME SCREEN -->
<main id="screen-home" class="screen">
  <div class="brand">
    <div class="brand-mark">TG</div>
    <div>
      <h1>Track Geometry Log</h1>
      <p class="sub">Cab-ride fault capture &amp; ELR/Mileage reference</p>
    </div>
  </div>

  <button id="btn-new-ride" class="btn-primary btn-huge">+ Start New Ride</button>

  <h2 class="section-label">Ride history</h2>
  <div id="ride-history-list" class="ride-list">
    <p class="empty-hint">No rides yet — start one above.</p>
  </div>
</main>

<!-- RIDE SCREEN -->
<main id="screen-ride" class="screen" hidden>
  <div class="ride-topbar">
    <button id="btn-back" class="btn-icon" aria-label="Back">←</button>
    <div class="ride-title">
      <input id="ride-name-input" class="ride-name-input" />
      <span id="ride-meta" class="ride-meta"></span>
    </div>
    <button id="btn-export" class="btn-icon" title="Export PDF">⇩ PDF</button>
  </div>

  <div id="map"></div>

  <div class="readout" id="readout">
    <div class="readout-row">
      <div class="readout-field">
        <span class="readout-label">ELR</span>
        <span class="readout-value" id="ro-elr">—</span>
      </div>
      <div class="readout-field">
        <span class="readout-label">Track</span>
        <span class="readout-value" id="ro-track">—</span>
      </div>
      <div class="readout-field readout-field-wide">
        <span class="readout-label">Mileage</span>
        <span class="readout-value readout-mileage" id="ro-mileage">—</span>
      </div>
    </div>
    <div class="readout-sub" id="ro-confidence">Waiting for GPS…</div>
  </div>

  <div class="fault-buttons" id="fault-buttons">
    <button class="fault-btn fault-btn-top" data-type="top">
      <span class="fault-btn-label">TOP</span>
      <span class="fault-btn-sub">vertical / surface</span>
    </button>
    <button class="fault-btn fault-btn-alignment" data-type="alignment">
      <span class="fault-btn-label">ALIGNMENT</span>
      <span class="fault-btn-sub">horizontal / lateral</span>
    </button>
  </div>

  <button id="btn-end-ride" class="btn-secondary">End Ride</button>

  <h2 class="section-label">Logged faults (<span id="fault-count">0</span>)</h2>
  <div id="fault-list" class="fault-list"></div>
</main>

<!-- NEW RIDE FORM OVERLAY -->
<div id="new-ride-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-title">Start New Ride</div>
    <form id="new-ride-form">
      <div class="form-field">
        <label for="nr-name">Name</label>
        <input type="text" id="nr-name" class="note-input" placeholder="Rider name" autocomplete="name">
      </div>
      <div class="form-field">
        <label for="nr-start">Start location</label>
        <input type="text" id="nr-start" class="note-input" placeholder="e.g. London Euston">
      </div>
      <div class="form-field">
        <label for="nr-end">End location</label>
        <input type="text" id="nr-end" class="note-input" placeholder="e.g. Birmingham New Street">
      </div>
      <div class="form-field">
        <label for="nr-date">Date</label>
        <input type="date" id="nr-date" class="note-input">
      </div>
      <button type="submit" id="nr-start-btn" class="btn-primary btn-huge nr-submit">Start Ride</button>
    </form>
    <button class="overlay-cancel" id="nr-cancel">Cancel</button>
  </div>
</div>

<!-- SEVERITY PICKER OVERLAY -->
<div id="severity-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-title" id="severity-title">TOP fault — severity?</div>
    <div class="severity-grid">
      <button class="sev-btn sev-slight" data-sev="slight">Slight</button>
      <button class="sev-btn sev-moderate" data-sev="moderate">Moderate</button>
      <button class="sev-btn sev-severe" data-sev="severe">Severe</button>
    </div>
    <button class="overlay-cancel" id="severity-cancel">Cancel</button>
  </div>
</div>

<!-- NOTE OVERLAY -->
<div id="note-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-title" id="note-title">Add note</div>
    <div class="note-presets" id="note-presets">
      <button class="note-preset-btn" data-note="S&amp;C">S&amp;C</button>
      <button class="note-preset-btn" data-note="Level Crossing">Level Crossing</button>
      <button class="note-preset-btn" data-note="Bridge">Bridge</button>
    </div>
    <div class="note-custom-row">
      <input type="text" id="note-input" class="note-input" placeholder="Or type your own…" maxlength="120" />
      <button id="note-save" class="note-save-btn">Save</button>
    </div>
    <button class="note-clear-btn" id="note-clear" hidden>Clear note</button>
    <button class="overlay-cancel" id="note-cancel">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast" hidden></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/lookup.js"></script>
<script src="/idb.js"></script>
<script src="/app.js"></script>
</body>
</html>
